syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;


//============================= 登陆服协议 ==============================//

/*** 注册账号 ****/
message AccountRegister{
  string account                    = 1;//账号
  string pwd = 2;						// 密码
}

message AccountRegisterResponse{
  HttpResult result                    = 1;//  注册结果
}

/*** 登陆账号 ****/
message AccountLogin{
  AccountChannelType channel                    = 1;//渠道
  string token = 2;						// 渠道token,如果 channel 是OFFICIAL ，则token格式为“账号 密码”
  // 如果channel 是CHANGYOU，则格式为一个json字符串 {"channel_id":xxxx,"validateInfo":xxxx} ,值为 畅游移动SDK调用login接口后返回data值
}

message AccountLoginResponse{
  HttpResult result = 1;
  string passport_session_id = 2;	// 登陆会话id，请求服务器列表时使用
  string user_id = 3;				// 游戏服的玩家账号id
  string sdk_user_id = 4 ;       //sdk的账号id，如果登陆时的AccountChannelType 是CHANGYOU，则表示是畅游sdk的user_id
  bool isNew = 10;				// 是否是新注册的账号
  string ext = 11;  			// 扩展参数，WECHAT渠道为openid
}

// 账号的渠道类型
enum AccountChannelType{
	CHANNEL_TYPE_NONE=0; //
	OFFICIAL=1; // 官方渠道
	WECHAT=2; //	微信渠道
	CHANGYOU=3; //	畅游sdk
}

/*** 请求服务器列表****/
message AccountServerList{
  string passport_session_id = 1;
}

message AccountServerListResponse{
	  HttpResult result                    = 1;
	  repeated ServerInfo servers = 2;
      // 总逻辑服数量
	  int32 totalServerCount = 5;
	  // 我进入过的逻辑服务器
	  repeated MyServerInfo myServerList = 6;
}

/*** 请求逻辑服务器列表****/
message AccountLogicServerList{
    string passport_session_id = 1;
    int32 page = 4; // 分页显示使用，当前页，从1开始
    int32 pageSize = 5; // 每页显示数量,默认10个
}

message AccountLogicServerListResponse{
    HttpResult result  = 1;
    repeated LogicServerInfo logicServerList = 3;
}

// 实际的物理服务器地址，客户端连接时使用
message ServerInfo {
	string serverId = 1;  // 服务器唯一id，实际的物理服务器id
	string name = 2;	// 服务器名字
	string ip = 3;		// ip，建立连接使用
	int32 port = 4;    // 端口，建立连接使用
	int32 status = 5;  //运行状态,1正常开启 2 维护 4 停服，一般只有状态是1才能进入
	string version = 6;  // 1.0.0.1这样的格式，前3个数字一样才可以进入这个服务器。
}

// 逻辑服务器地址，游戏中玩家创建账号选择的服务器
message LogicServerInfo {
  string serverId = 1;  // 服务器唯一id，选服依据
  string name = 2;  // 服务器名字
  int32 seq = 3;  // 服务器序号，可以用来排序，一般从1开始代表1服
  int32 openTime = 6; // 服务器开服时间，秒时间戳，看情况使用，例如默认进最新的服务器
  int32 status = 7;  // 运行状态,1正常开启（火爆） 2 维护
  bool isNew = 8;  // 是否是新服
}
// 我进入过的服务器
message MyServerInfo {
  string serverId = 1;  // 服务器唯一id，对应LogicServerInfo中的serverId
  string name = 2;  // 玩家名字
  int32 level = 3;  // 等级
  int32 lastEnterTime = 4;  // 最后一次进入该服务器的时间，秒时间戳
  string playerId = 8;  // 在这个服务器的玩家id
}


// 自定义的http结果
message HttpResult{
	string errorMsg = 1;   // 错误描述， 如果为空表示没有错误。
	AccountErrorCode errorCode = 2;   // 具体的错误
}

// 账号校验失败时的错误类型
enum AccountErrorCode{
	ACCOUNT_EMPTY=0; // 注册时账号为空
	ACCOUNT_EXIST=1; //	注册时账号已经存在了
	ACCOUNT_NOT_EXIST=2; //	登陆时账号不存在
	PASSWORD_ERROR =3; //	登陆时密码错误
	CHANNEL_NOT_SUPPORT=4; //不支持的登陆渠道
	PASSPORT_SESSION_ERROR=5; //错误的sessinon，可能没有登陆，或者过期了。
	CHANNEL_CHECK_FAIL=6; // 渠道账号校验错误
	ACCOUNT_CREATE_FAIL=8; // 账号创建失败
	ACCOUNT_BANNED=10; // 账号被封---目前在畅游sdk登陆，有可能有这个错误
	ACCOUNT_REGISTER_NOT_ALLOWED =15; //正式运行环境不允许自己注册账号
	INVALID_REQUEST=20; //请求数据不合法
	SYSTEM_ERROR=30; //服务器异常
}
