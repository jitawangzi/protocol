syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;

import "BaseMsg.proto" ;
import "RewardMsg.proto" ;
//import "ItemMsg.proto" ;

//@HandlerPackage cn.game.games.net.game.handler
//@MessageModule 6f

// gm指令
message TestGmCmdRequest_6f000001{
	string cmd = 1;  // 指令格式:  指令类型空格参数空格参数。。。不同类型的指令有不同的参数类型和数量 例如：item id 数量
	//具体的指令有：1
	// item 增加物品或者资源 ,参数1 为表id 参数2为数量
}

message TestGmCmdResponse_6f000002{
  string debugInfo = 1; // gm指令如果需要一些额外的显示数据

}

// 获取游戏中的各种物品
message TestAddItemRequest_6f000008{
	uint32 id 	= 1 ;		// 想要获取的奖励id,道具id，或者资源id等
	uint32 count = 2;		// 数量，如果是0，代表本类奖励的所有奖励，装备数量是1，道具数量999，角色数量1，数量设置为0时，id可以不设置具体id，用类型也可以，比如道具是2
}

message TestAddItemResponse_6f000009{
	repeated RewardInfo resource = 1;	// 获得的奖励
}

// 直接完成任务
message TestMissionFinishRequest_6f000022{
	repeated uint32 id 	= 1 ;		// 任务表id，完成多个任务注意任务的先后顺序
}

message TestMissionFinishResponse_6f000023{
	repeated RewardInfo resource = 1;	// 获得的奖励
}


/*** 请求玩家资产，测试使用，一般用来比对前后端资源，检查资源不同步的操作。  **/
message TestPlayerAssetDataRequest_6f000028{
}
/***  **/
message TestPlayerAssetDataResponse_6f000029{
   map<uint32, uint64> assets = 2;   // 主要是货币，附带一些经验体力等数据。   key:Asset表id
   repeated ItemInfo items  = 5;        //道具  Item表
}


// 清空资源和道具
message TestClearResourceAndItemRequest_6f000040{
}

message TestClearResourceAndItemResponse_6f000041{
}

// 将某人退出账号
message TestPlayerLogoutRequest_6f000042{
	uint64 playerId = 1;		// 玩家id
}

message TestPlayerLogoutResponse_6f000043{
}

// 将某人删档
message TestPlayerDeleteRequest_6f000044{
	uint64 playerId = 1;		// 玩家id
}

message TestPlayerDeleteResponse_6f000045{
}

// 只是测试
message TestRunRequest_6f000020{
	uint32 id 	= 1 ;		//
}

message TestRunResponse_6f000021{
	uint32 data 	= 1 ;		//

}

//模拟测试某玩家发送协议
message TestMessageRequest_6f000080{
	uint64 playerId = 2;		// 玩家id
	uint32 id = 3;				// 消息id
	bytes data = 4;				// 消息内容
}
message TestMessageResponse_6f000081{

}
//检查一些配置数据。
message TestConfigCheckRequest_6f000090{
}
message TestConfigCheckResponse_6f000091{

}

// 查询已注册的GM指令元数据目录
message TestGmSchemaRequest_6f000100{
	string group_filter = 1;	// 分组过滤名，空表示返回全部允许的动作
}
message TestGmSchemaResponse_6f000101{
	string schema_version = 1;	// 元数据协议版本号
	string schema_json = 2;		// GM动作元数据目录JSON
}

// 结构化执行GM动作
message TestGmExecRequest_6f000102{
	string action = 1;			// 目标GM动作ID或命令名
	string params_json = 2;		// 参数JSON对象字符串
	int64 target_player_id = 3;	// 目标玩家ID，0表示当前连接玩家
	string trace_id = 4;		// 调用方透传的追踪ID
}
message TestGmExecResponse_6f000103{
	string result_json = 1;		// 标准GmResult JSON结果
	int64 player_id = 2;		// 当前玩家ID
	int32 msg_id = 3;			// 关联的请求消息号（如0x6f000102）
	string msg_name = 4;		// 关联的请求消息名
	int32 seq = 5;				// 请求序列号
	int64 timestamp_ms = 6;		// 服务端响应时间戳（毫秒）
	string trace_id = 7;		// 调用方透传的追踪ID
}

// 只读查询策划配置表数据
message TestConfigQueryRequest_6f000104{
	string op = 1;				// 操作类型：tables/listTables/list/get
	string table = 2;			// 配置表名
	int32 id = 3;				// 主键ID（op=get时使用）
	int32 page = 4;				// 分页页码（从1开始）
	int32 page_size = 5;		// 每页条数
	string filter_json = 6;		// 过滤条件JSON字符串
}
message TestConfigQueryResponse_6f000105{
	string schema_version = 1;	// 结果结构版本号
	string result_json = 2;		// 查询结果JSON
}

// 查询服务端已注册网络协议目录
message TestProtoCatalogRequest_6f000106{
	int32 module_filter = 1;	// 按模块号过滤，0表示全部模块
	bool include_schemas = 2;	// 是否附带消息字段结构元数据
}
message TestProtoCatalogResponse_6f000107{
	string schema_version = 1;	// 目录结构版本号
	string catalog_json = 2;	// 协议目录JSON
}

// 只读自省在线玩家模块内存及独立分表状态
message TestInspectPlayerRequest_6f000108{
	int64 target_player_id = 1;	// 目标玩家ID，0表示当前连接玩家
	repeated string modules = 2;// 模块类名或简名过滤列表，空表示全部模块
	string scope = 3;			// 自省作用域（仅支持player）
}
message TestInspectPlayerResponse_6f000109{
	string schema_version = 1;	// 快照结构版本号
	string result_json = 2;		// 只读模块快照JSON
}