syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;

import "RewardMsg.proto" ;
import "BaseMsg.proto" ;

//一些玩家级别的养成
//@HandlerPackage cn.game.games.net.game.module.develop
//@ClientHandlerPackage cn.game.simulation.client.handler
//@MessageModule 25

// 潜力修炼，升级
message DevelopPotentialLvUpRequest_25000001{
	uint32 id = 1;  	//属性id。Potential表PotentialMark列
}

message DevelopPotentialLvUpResponse_25000002{
}


// 潜力修炼，突破
message DevelopPotentialBreakRequest_25000003{
	uint32 id = 1;  	//属性id。Potential表PotentialMark列
}

message DevelopPotentialBreakResponse_25000004{
}


// 强援修炼，升级
message DevelopRescueLvUpRequest_25000007{
	uint32 id = 1;  	//属性id。Rescue表PotentialMark列
}

message DevelopRescueLvUpResponse_25000008{
}


// 天道修为晋升，提升等级。
message DevelopHeavenlyDaoLvUpRequest_25000010{
}

message DevelopHeavenlyDaoLvUpResponse_25000011{
  repeated RewardInfo rewards = 1; // 晋升获得的奖励
}

//  **************************** 乾坤镜 ***************************

// 乾坤镜相关数据
message QianKunMirrorInfo{
	// 当前安装的灵魄，按照数组的顺序作为安装的顺序
	repeated SpiritualInfo spiritual = 1;
	SpiritualInfo spiritualReplace = 2;  // 已经逆转出来的，尚未选择丢弃或者替换的灵魄
	repeated int32 spiritualRootIds = 3; // 已经点亮的  SpiritualRoot 表id
	int32 startPos = 4; // 乾坤逆转起始顺序。 从0开始到5，再从0开始

}
//灵魄数据
message SpiritualInfo{
  uint32 quality  = 1; //  品质
  int32 level = 2;
  repeated AttrGrowInfo atts = 3; //附加属性条目
}

// 乾坤逆转请求
message QianKunMirrorReversalRequest_25000020{
}

message QianKunMirrorReversalResponse_25000021{
	SpiritualInfo spiritual = 1;
}


// 替换或者丢弃灵魄
message QianKunMirrorReplaceRequest_25000022{
	bool replace = 1; // true 替换， false  丢弃。
}

message QianKunMirrorReplaceResponse_25000023{
	repeated RewardInfo rewards = 1 ; 			// 分解后获得的物品
}

// 点亮/解锁 灵根淬炼
message QianKunMirrorSpiritualRootUnlockRequest_25000024{
  int32 id = 1; // SpiritualRoot 表id
}

message QianKunMirrorSpiritualRootUnlockResponse_25000025{
}

// 防线升级
message DefenceLevelUpRequest_25000031{
}

message DefenceLevelUpResponse_25000032{
}
// 防线皮肤升星
message DefenceSkinStarUpRequest_25000033{
	string starUpUid = 1; //需要升星的防线皮肤唯一id
	repeated string ConsumedUids = 2; // 选择消耗的防线皮肤唯一id
}

// 防线皮肤升星返回
message DefenceSkinStarUpResponse_25000034{
  // 客户端自己+1星，扣掉消耗的皮肤
}


// 防线皮肤更换
message DefenceSkinChangeRequest_25000035{
  string uid = 1; //选择使用的皮肤唯一id,如果不传值，表示卸下皮肤。
}

message DefenceSkinChangeResponse_25000036{
}


