syntax = "proto3";
package cn.game.protocol.protobuf;

import "RewardMsg.proto";

// 商店页签类型
enum ShopTabType {
    ShopTabType_None = 0; // 占位
    Grocery = 1;    // 杂货铺
    Antique = 2;    // 中古店
    Diamond = 3;    // 钻石充值
    Pack = 4;       // 超值礼包
}

// 限购重置类型
enum ShopLimitType {
    ShopLimitType_None = 0; // 不限购
    Daily = 1;      // 每日重置
    Weekly = 2;     // 每周重置
    Permanent = 3;  // 终身限购
}

// 商店商品信息
message ShopItemInfo {
    int32 shopId = 1;       // 商品配置ID (ShopItem.xlsx ID)
    int32 buyCount = 2;     // 已购买次数 (周期限购使用)
    bool isSoldOut = 3;     // 是否已售罄 (中古店使用)
    int32 slotIndex = 4;    // 槽位索引 (中古店使用)
}

// 获取商店信息请求
message ShopInfoRequest_50000001 {
    int32 tabType = 1;      // 页签类型 (ShopTabType枚举)
}

// 获取商店信息响应
message ShopInfoResponse_50000002 {
    int32 tabType = 1;
    repeated ShopItemInfo items = 2; // 商品列表
    int64 nextRefreshTime = 3;       // 下次自动刷新时间戳 (中古店有效)
    int32 manualRefreshCount = 4;    // 今日手动刷新次数 (中古店有效)
}

// 购买请求
message ShopBuyRequest_50000003 {
    int32 shopId = 1;       // 商品配置ID
    int32 count = 2;        // 购买数量
}

// 购买响应
message ShopBuyResponse_50000004 {
    repeated RewardInfo rewards = 1; // 获得的奖励 (BaseMsg/RewardMsg 定义)
    ShopItemInfo item = 2;           // 更新后的商品状态 (主要更新buyCount/isSoldOut)
}

// 刷新请求
message ShopRefreshRequest_50000005 {
    int32 tabType = 1;      // 只有中古店(Type=2)支持
}

// 刷新响应
message ShopRefreshResponse_50000006 {
    repeated ShopItemInfo items = 1; // 刷新后的新商品列表
    int32 manualRefreshCount = 2;    // 更新后的刷新次数
}
