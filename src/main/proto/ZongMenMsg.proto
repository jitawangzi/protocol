//悬赏相关
message ZongMenBountyProto{
  ZongMenBountyMissionProto bountyMission = 1;
  int32 acceptCount = 3;  // 当天已经接取的悬赏次数。
  int32 refreshCount = 4; // 目标刷新次数
  int32 challengeCount = 5; // 挑战次数
}

//悬赏任务数据
message ZongMenBountyMissionProto{
  int32 id = 1;       //悬赏任务id： GuildBountyBar 表id
  int32 startPlace = 2;   //  悬赏任务的起点 GuildBargainPlace 表id
  int32 endPlace = 3;   //  悬赏任务的终点 GuildBargainPlace 表id
  int32 state = 4 ;     // "任务状态, 2:可接 3:已接（进行中，未完成）4: 任务结束,可领奖。
  int32 startTime = 5 ;   // 针对state是3 已接的任务，任务的接受时间(秒时间戳)
  int32 endTime = 6 ;     // 针对state是3 已接的任务，任务的实际结束时间(秒时间戳，算上了)
}
//参与悬赏任务的玩家
message ZongMenBountyPlayerProto{
  SimplePlayerInfo player = 1;//玩家信息
  ZongMenBountyMissionProto mission = 2; //悬赏任务数据
}
//宗门悬赏任务战报
message ZongMenBountyBattleReport{
  string uid = 1;     // 战报唯一id
  int32 id = 2;       //悬赏任务id： GuildBountyBar 表id
  int32 attackTime = 3;   //挑战时间， 秒时间戳
  string attackerId = 4;  //挑战者id
  string attackerName = 5;  //挑战者名字
  string attackerHead = 6;  //挑战者头像
  string playerName = 8;  //接任务者名字
  bool isWin = 9;       //挑战结果
  bool isLoss = 10;     //挑战成功时， 是否损失了奖励
}
//宗门悬赏任务战报,带有挑战者的状态
message ZongMenBountyBattleReportAttacker{
  ZongMenBountyBattleReport report = 1;
  bool isAttatckerMission = 2;      //挑战者是否正在进行悬赏任务
}



// 接悬赏任务
message ZongMenBountyAcceptRequest_40000070{
}
message ZongMenBountyAcceptResponse_40000071{
}

// 领取当前悬赏任务奖励
message ZongMenBountyRewardRequest_40000072{
}
message ZongMenBountyRewardResponse_40000073{
  int32 event = 1;          //悬赏结束时产生的奇遇事件， GuildAdventureEvent 表id
  repeated RewardInfo eventRewards = 2; // 奇遇事件奖励
  repeated RewardInfo bountyRewards = 3; // 悬赏奖励
  ZongMenBountyProto bounty = 4;      // 更新悬赏数据，会有新的悬赏任务
}


// 刷新悬赏的目标列表
message ZongMenBountyTargetRefreshRequest_40000074{
}
message ZongMenBountyTargetRefreshResponse_40000075{
  repeated ZongMenBountyPlayerProto players = 1;
}


// 悬赏挑战、 反击  开始战斗
message ZongMenBountyBattleStartRequest_40000076{
  string playerId = 1;  // 攻击的玩家id
}
message ZongMenBountyBattleStartResponse_40000077{
}

// 悬赏挑战、 反击  结束战斗
message ZongMenBountyBattleEndRequest_40000078{
  string playerId = 1;  // 攻击的玩家id
  bool isWin = 2;     // 是否胜利
}
message ZongMenBountyBattleEndResponse_40000079{
}
// 悬赏战报
message ZongMenBountyBattleReportRequest_4000007a{
  bool isZongMen = 1;  // true ：查看宗门战报， false：查看个人战报
}
message ZongMenBountyBattleReportResponse_4000007b{
  repeated  ZongMenBountyBattleReportAttacker reports = 1;
}
// 查看某个玩家当前的悬赏详情
message ZongMenBountyPlayerRequest_4000007c{
  string playerId = 1;
}
message ZongMenBountyPlayerResponse_4000007d{
   SimplePlayerInfo player = 1;//玩家基本数据
   ZongMenBountyMissionProto mission = 2; // 悬赏数据，如果没有进行中的悬赏任务，则为null
}

