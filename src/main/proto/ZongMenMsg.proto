syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;

import "RewardMsg.proto" ;
import "BaseMsg.proto" ;

//@HandlerPackage cn.game.games.net.game.module.zongmen
