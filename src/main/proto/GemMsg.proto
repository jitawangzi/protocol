syntax = "proto3";
package cn.game.protocol.protobuf;

import "RewardMsg.proto" ;
import "BaseMsg.proto" ;
import "PlayerMsg.proto" ;
//@HandlerPackage cn.game.games.net.game.module.develop.gem
//@ClientHandlerPackage cn.game.simulation.client.handler
//@MessageModule 10

// 宝石协议
//宝石镶嵌/替换
message GemWearRequest_10000001 {
  string uid = 1; //唯一id
  int32 pos = 2; // 镶嵌位置： 0、1、2、3、4
}

message GemWearResponse_10000002 {

}

//宝石卸下
message GemTeardownRequest_10000003 {
  string uid = 1; //唯一id
}

message GemTeardownResponse_10000004 {

}

//宝石锁定
message GemLockRequest_10000005 {
  repeated  string uid = 1; //唯一id
  bool lock = 2;   // true 锁定,false  解锁
}

message GemLockResponse_10000006 {

}


//宝石合成/一键合成
message GemComposeRequest_10000007 {
  repeated string uids = 1; //已有的宝石
}

message GemComposeResponse_10000008 {
	// 生成的新的宝石,客户端自己删除掉参与合成的宝石
	repeated RewardInfo rewards = 1;
}
//宝石洗练
message GemXiLianRequest_10000010 {
   string uids = 1; //已有的宝石
}

message GemXiLianResponse_10000011 {
	GemInfo gem = 1;
}

//宝石抽奖
message GemGacheRequest_10000012 {
   int32  gemPool=1;  // 1 普池  2 高池
   int32  gemcount=2;  // 1 单抽  10 10连抽
   int32  gemType=3;  // 1 看视频免费  2 扣道具 3 扣钻石
}
//宝石抽奖
message GemGacheResponse_10000013 {
	repeated RewardInfo rewards = 1;    
	int32 gemGacheFreeTimesNormal = 2;  //宝石抽奖剩余免费广告次数
    int32 gemGacheFreeTimesHigh = 3;  //宝石抽奖剩余免费广告次数
}