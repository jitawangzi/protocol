syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;



// 道具信息
message ItemInfo{
     uint32 id = 1;		//道具id  Item.xlsm表id
     uint32 count = 2;		//道具数量
}

// 资源数据
message AssetInfo{
     uint32 id = 1;		//资源id。Asset表的id
     uint64 count = 2;		//资源数量
}

// 物品信息
message GoodsInfo{

     uint32 id = 1;		//id，可以是Asset表id、Hero表的id、Item表的id等等
     uint32 count = 2;		//数量
}

message MoneyRecoverInfo{
     uint32 id = 1;		//id，Money表id
     uint32 time = 2;		//上次恢复的时间戳（秒）
}

// 英雄信息
message HeroInfo{
	string uid = 1;//英雄唯一id
	uint32 configId = 2;//Hero配置表 ID
	uint32 level = 3;//等级
	uint32 star = 4 ;// 星级
//	bool isBattle = 5; // 是否上阵了
	string fashionUid = 6 ;// 穿戴的时装唯一id
	uint32 quality = 7 ;  // 品质。
	uint32 battlePos = 8 ;  // 上阵位置 1-5 ，0未上阵
	uint32 skin = 10 ;  // 当前穿戴的皮肤id，HeroSkin表id
}

// 合成英雄信息
message HCHeroInfo{
	string uid = 1;//英雄唯一id
	uint32 configId = 2;//HCHero配置表 ID
	uint32 level = 3;//等级
	uint32 star = 4 ;// 星级
}
// 英雄武器
message HeroSwordInfo{
	string uid = 1;//武器唯一id
	uint32 configId = 2;//HeroSword配置表 ID
	uint32 star = 3 ;// 星级
}
//合并的英雄装备
message MergeEquipmentInfo{
  uint32 id  = 1; //Equip配置表id
  uint32 level = 2;  // 等级
}
//装备
message EquipInfo{
  string uid	   = 1; //唯一id
  uint32 configId  = 2; //Equip配置表id
  map<uint32, uint32> attrs = 6; //装备附加属性条目
}
//装备部位，1-头盔2-披风3-衣服4-项链5-戒指6-靴子，对应Equip的pos。
message EquipPartInfo{
  uint32 type  = 1; //部位类型，1-6
  uint32 strength = 2; //强化等级
//  uint32 breakthrough = 3; //突破等级
  string equipUid	 = 4; //这个装备部位上安装的装备唯一id,如果没有值或者是0，都表示没有装备。
  map<string, int32> gemMap = 6; //这个装备部位上安装的宝石, key: 宝石唯一id，value: 位置，0 - 4

}

//装备、宝石等的展示数据
message EquipPartShowInfo{
  uint32 type  = 1; //部位类型，1-6
  uint32 strength = 2; //强化等级
  EquipInfo equip  = 4; //这个部位上安装的装备
  repeated GemInfo gems = 6; //这个装备部位上安装的宝石
}
// 英雄时装
message HeroFashionInfo{
	string uid = 1;//时装唯一id
	uint32 configId = 2;//HeroFashion配置表 ID
	uint32 star = 3 ;// 星级
}

//英雄属性信息
message HeroAttrInfo{
	uint32 id 	 = 1;//
	uint32 value = 2;// 属性值
}

//英雄属性点数信息
message HeroAttrPointInfo{
	uint32 id 	 = 1;// AttributeTypeEnum 表的id
	uint32 value = 2;// 属性点数
}

//属性信息
message AttrGrowInfo{
	uint32 id 	 = 1;//  属性id
	uint32 startValue = 2;// 初始值
	uint32 growValue = 3;// 成长值
}

// 宝石数据
message GemInfo{
  string uid	   = 1; //唯一id
  uint32 configId  = 2; //Gem配置表id
  repeated uint32 entryEffectIds = 6; // 宝石效果条目，EntryEffect 表id
  bool isLock = 4;  // 锁定状态，true：锁定了。
}

// 防线皮肤信息
message DefenceSkinInfo{
  string uid = 1;//唯一id
  uint32 configId = 2;//DefenceSkin配置表 ID
  uint32 star = 3 ;// 星级
}

// 龙数据
message DragonInfo{
  uint32 id  = 1; //Dragon配置表id
  uint32 star  = 2; //Dragon星级
}
// 龙技能数据
message DragonSkillInfo{
  uint32 id  = 1; //DragonSkil配置表id
  uint32 level  = 2; //技能等级
}


//技能信息
message SkillInfo{
	uint32 id = 1; //Skill表id
	repeated uint32 strengthenIds = 2;//已经激活强化项id,SkillBuff表的id
}

//宠物
message PetInfo{
	int32 id = 1; // SoulSoulPet表id
	int32 level = 2; // 等级
	int32 breakLevelMax = 3;  // 已经突破的最高等级，例如在20、40、60级时需要突破后才能继续升级，如果在40级时突破了， 则记录40
	repeated int32 skills = 4;  // 拥有的洗练技能， SoulPetSkill表id
	repeated int32 petSkillsToSave = 24;  // 已经消耗道具洗练出来尚未保存的技能id  SoulPetSkill 表id
}

// 神通
message SecretscriptInfo{
	int32 id = 1; // Secretscript表的SecretscriptMark字段。
	int32 level = 2; // 等级
	int32 star = 3;  // 星级
}

// 领取过图鉴奖励的星级，和最高品质。
message QualityStar{
	int32 heroId = 1;
	int32 quality = 2;
	int32 star = 3;
}



// 玩家的简单信息
message SimplePlayerInfo{
	string id = 1; 			// id
	string name = 2; 		//名称
	uint32 level = 3; 		// 等级
	uint32 combatEffectiveness = 4; // 战力
	uint32 vipLevel = 5; // vip等级
	uint32 head = 6; 		// 头像id
	uint32 headFrame = 7; 		// 头像框
	bool online = 8  ;      // 是否在线
	uint32 offlineTime = 9  ; // 如果离线，此值表示最近的下线时间，秒的时间戳
	string serverId = 10; // 玩家所在服务器id，暂时用不到
	string serverName = 11; // 玩家所在服务器名，暂时用不到
	uint32 tiandaoLevel = 12; // 天道修为等级。
	uint32 figure = 15; // 玩家的形象， PlayerFigure 表id
	map<uint32,string> equipBattleRecord  = 16; // 装备本战报
	uint32 unionId = 17; // 联盟ID
}

// 玩家展示的名片数据
message PlayerShowInfo{
	int32 battleId = 1;   // 主线关卡进度  Battle表id
	string guild = 2; 		// 公会名称
  	repeated HeroInfo heros  = 7;        //当前阵容。
  	repeated EquipPartShowInfo parts = 8;  // 装备、宝石等数据
}

// 微信支付的相关参数
message PaymentOrderProto{
	string signData = 1;
	string paySig = 2;
	string signature = 3;
}

message PlayerRankInfo{
	SimplePlayerInfo player = 1;  //玩家基本数据
	int32 rank = 2; //排名，-1或0表示没有进入排行榜，没有名次
	string score = 3; //参与排行的分数，例如等级数、战力值、关卡id等等。
}

message EquipTowerHelpRewardInfo{
	int32 helpfloor = 1;  //助战层数
	int32 helpReward = 2; //助战奖励 0 未领取  1已领取
	int64 helpID = 3; //助战唯一ID
}
message MountainMapNodeData{
	int32 nodeID = 1;  //助战层数 floor * 1000 + line * 10 + index  1011 1层1行1点  
	int32 nodeStatus = 2; //节点状态 0 未打 1 已打
	int32 nodeType = 3; //节点类型
	repeated int32 monsterId = 4; // 怪物id
	int32 levelpro = 6; 		// 等级参数
	int32 eventId = 7; 		// 事件
	repeated int32 shopId = 8  ;      // 物品信息
}
message PVEVPRecordData{
	 int32 result = 1; //1 胜利 2 失败
	 string name = 2; 		//名称
	 int32 level = 3; 		// 等级
     int32 combatEffectiveness = 4; // 战力
	 int32 scoreChange = 5; //变化后排名
	 int32 head = 6; 		// 头像id
	 int32 headFrame = 7; 	// 头像框
	 int64 battleTime = 8;  //战斗记录ID
	 int32 type = 9; //1 进攻 2 防守
	 string playerId =10;  //对战玩家
}

enum UpdateType{
  UPDATE = 0; // 更新
  ADD = 1; //增加
  DELETE = 2; //删除
}

