syntax = "proto3";
package cn.game.protocol.protobuf;
//option optimize_for = LITE_RUNTIME;



// 宗门 gameServer => 发送到zongMenServer 的消息
message ZongMenMsgRequest_41000045{
	int32 msgId = 1; //宗门相关的协议
	bytes data = 2; //数据
	int64 playerId = 3; //玩家id
	int64 zongMenId = 4; //宗门id
	repeated string params = 5;// 上下文参数
}

message ZongMenMsgResponse_41000046{
	int32 	errorCode = 1; //错误码
	int32 	msgId = 2; //消息id
	bytes data = 4; //数据
	int64 playerId = 5; //玩家id
}
